# Configuración mínima del broker MQTT de HomeVault AI.
# El servicio NO publica puertos al host (ver docker-compose.yml), por lo que
# allow_anonymous solo aplica dentro de la red interna homevault-net.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
