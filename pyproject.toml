[project]
name = "homevault-ai"
version = "0.1.0"
description = "Plataforma de gestión del hogar con vault Markdown como única fuente de verdad"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "portalocker>=2.8",
    "google-api-python-client>=2.100",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "python-dateutil>=2.9",
    "mcp>=2.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "python-multipart>=0.0.9",
    "aiomqtt>=2.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "GitPython>=3.1",
    "python-escpos>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["backend", "backend.routers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
